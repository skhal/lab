---
# keep-sorted start
ansible_jexec_over_ssh_jail_name: ldap
certval_certificates:
  - name: "OpenLDAP Certificate"
    path: /usr/local/etc/openldap/ssl/ldap.crt
openldap_server_addr: 10.0.0.3
openssl_gen_common_name: ldap.lab.net
openssl_gen_crt: "/usr/local/etc/openldap/ssl/ldap.crt"
openssl_gen_group: ldap
openssl_gen_owner: ldap
openssl_gen_rsa_fetch:
  source: pkg.lab.net:/usr/local/etc/poudriere/ssl/pkg.pub
  target: /usr/local/etc/pkg/ssl/lab-ports.pub
ssh_listen_addresses:
  - 10.0.0.3
# keep-sorted end
