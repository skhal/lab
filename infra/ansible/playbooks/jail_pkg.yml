---
- name: Create PKG jail
  hosts: nuc.lab.net
  tags: create
  vars:
    # keep-sorted start
    jail_allow_chflags: true
    jail_allow_mlock: true
    jail_allow_mount: true
    jail_allow_mount_devfs: true
    jail_allow_mount_linprocfs: true
    jail_allow_mount_nullfs: true
    jail_allow_mount_procfs: true
    jail_allow_mount_tmpfs: true
    jail_bridge: bridge0
    jail_children_max: 10
    jail_cidr: 10.0.0.5/24
    jail_defaultrouter: 10.0.0.1
    jail_depend:
      - dns
    jail_enforce_statfs: 1
    jail_name: pkg
    # keep-sorted end
  roles:
    - role: linux
    - role: jail

- name: Bootstrap PKG jail
  hosts: pkg.lab.net
  tags: bootstrap
  roles:
    - role: ssh
    - role: syslog
    - role: user
    - role: pkg
    - role: timezone

- name: Configure DNS server
  hosts: pkg.lab.net
  tags: dns
  roles:
    - role: local_unbound

- name: Configure certificate
  hosts: pkg.lab.net
  tags: cert
  roles:
    - role: openssl_ca

- name: Configure PKG
  hosts: pkg.lab.net
  tags: pkg
  roles:
    - role: openssl_gen
      tags: pkg-gen-cert
    - role: local_pkg

- name: Configure PKG repos
  hosts: pkg.lab.net
  tags: pkg-repos
  tasks:
    - name: Add repos
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos

- name: Configure poudriere
  hosts: pkg.lab.net
  tags: poudriere
  roles:
    - role: poudriere
