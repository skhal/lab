---
- name: Create PKG jail
  hosts: nuc.lab.net
  tags: create
  vars:
    # keep-sorted start
    jail_bridge: bridge0
    jail_cidr: 10.0.0.5/24
    jail_defaultrouter: 10.0.0.1
    jail_name: pkg
    # keep-sorted end
  roles:
    - role: jail

- name: Bootstrap PKG jail
  hosts: pkg.lab.net
  tags: bootstrap
  roles:
    - role: ssh
    - role: syslog
    - role: user
    - role: pkg
    - role: timezone

- name: Configure certificate
  hosts: pkg.lab.net
  tags: cert
  roles:
    - role: openssl_ca

- name: Configure PKG
  hosts: pkg.lab.net
  tags: pkg
  roles:
    - role: local_pkg
