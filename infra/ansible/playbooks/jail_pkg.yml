---
- name: Configure PKG repos
  hosts: pkg.lab.net
  tags: pkg-repos
  tasks:
    - name: Fetch repo public keys
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

- name: Configure poudriere
  hosts: pkg.lab.net
  tags: poudriere
  roles:
    - role: poudriere
