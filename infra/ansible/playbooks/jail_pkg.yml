---
- name: Configure DNS server
  hosts: pkg.lab.net
  tags: dns
  roles:
    - role: local_unbound

- name: Configure PKG
  hosts: pkg.lab.net
  tags: pkg
  roles:
    - role: openssl_gen
      tags: pkg-gen-cert
    - role: local_pkg

- name: Configure PKG repos
  hosts: pkg.lab.net
  tags: pkg-repos
  tasks:
    - name: Add repos
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
    - name: Fetch repo public keys
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

- name: Configure poudriere
  hosts: pkg.lab.net
  tags: poudriere
  roles:
    - role: poudriere
