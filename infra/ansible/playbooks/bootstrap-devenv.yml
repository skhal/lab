# NAME
#   bootstrap-devenv • setup development environment
#
# SYNOPSIS
#   ansible-playbook ./playbooks/bootstrap-devenv.yml
#
# DESCRIPTION
#   bootstrap-devenv configures userland for development.
---
- name: Install packages
  hosts: dev
  tags: bootstrap-devenv-pkg
  vars_files:
    - vars/dev.yml
  roles:
    - role: pkg
