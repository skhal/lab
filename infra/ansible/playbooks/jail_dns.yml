---
- name: Configure PKG repos
  hosts: dns.lab.net
  tags: pkg-repos
  tasks:
    - name: Add repos
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
    - name: Fetch repo public key
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

- name: Certificate validation
  hosts: dns.lab.net
  tags: certval
  roles:
    - role: certval
