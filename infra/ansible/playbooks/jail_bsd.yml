---
- name: Configure PKG repos
  hosts: bsd.lab.net
  tags: pkg-repos
  tasks:
    - name: Add repos
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
    - name: Fetch repo public key
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

- name: Configure DNS server
  hosts: bsd.lab.net
  tags: dns
  roles:
    - role: local_unbound

- name: Configure SSO
  hosts: bsd.lab.net
  tags: sso
  roles:
    - role: openldap_client
    - role: pam_ldap

- name: Setup development environment
  hosts: bsd.lab.net
  tags: devenv
  vars_files:
    - vars/dev.yml
  roles:
    - role: pkg

# add poudriere(8) for ports development.
- name: Configure poudriere
  hosts: bsd.lab.net
  tags: poudriere
  roles:
    - role: poudriere
