# NAME
#   bootstrap-nuc • minimal configuration of freshly installed FreeBSD on NUC.
#
# SYNOPSIS
#   ansible-playbook ./playbooks/bootstrap-nuc.yml
#
# DESCRIPTION
#   bootstrap-nuc performs minimal configuration of NUC with fresh installation
#   of FreeBSD OS. It includes the following steps:
#
#     - install Python and doas(1) for Ansible to manage the host.
#     - break /etc/rc.conf into per-service rc configurion under /etc/rc.conf.d.
#     - configure user environment (group, shell, etc.).
#     - setup network and firewall
#     - configure remote access
#
#   Every step of the configuration is tagged with bootstrap- prefix.
---
# The server is bare-bone with fresh OS install. It includes su(1) to escalate
# privileges.
- name: Bootstrap for Ansible
  hosts: nuc.lab.net
  tags: bootstrap-ansible
  become_method: ansible.builtin.su
  roles:
    - role: bootstrap

- name: Configure services
  hosts: nuc.lab.net
  tags: bootstrap-services
  roles:
    # keep-sorted start
    - role: hostname
    - role: ntp
    - role: periodic
    - role: pkg
    - role: rc
    - role: syslog
    - role: timezone
    - role: zfs
    # keep-sorted end

- name: Bootstrap users
  hosts: nuc.lab.net
  tags: bootstrap-users
  roles:
    # keep-sorted start
    - role: doas
    - role: user
    - role: zfs_mkhomedir
    # keep-sorted end

- name: Configure network
  hosts: nuc.lab.net
  tags: bootstrap-network
  roles:
    - role: routing
    - role: netif

- name: Configure firewall
  hosts: nuc.lab.net
  tags: bootstrap-firewall
  roles:
    - role: pflog
    - role: pf

- name: Configure remote access
  hosts: nuc.lab.net
  tags: bootstrap-remote-access
  roles:
    - role: ssh
