[project]
name = "poetry-plugin-patch"
version = "0.0.0"
description = "Poetry patch command to patch packages."
readme = "README.md"
requires-python = ">=3.13,<4.0"
authors = [{ name = "Samvel Khalatyan", email = "sn.khalatyan@gmail.com" }]
dependencies = ["poetry (>=2.5.1,<3.0.0)"]

[project.entry-points."poetry.application.plugin"]
patch = "poetry_plugin_patch.plugin:PatchApplicationPlugin"

[dependency-groups]
dev = ["pyfakefs (>=6.3.2,<7.0.0)", "pytest (>=9.2.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "poetry_plugin_patch", from = "src" }]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]
