[project]
name = "lab"
version = "0.0.0"
description = "R&D Lab"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
authors = [{ name = "Samvel Khalatyan", email = "sn.khalatyan@gmail.com" }]

[project.urls]
repository = "https://github.com/skhal/lab"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false  # use poetry only for dependency management

[tool.poetry.dependencies]
# keep-sorted start
ansible-core = ">=2.20"
ansible-lint = "^26.11.0"
# keep-sorted end
libvirt-python = { version = "^12.9.0", markers = "sys_platform == 'darwin'" }
lxml = { version = "^6.1.3", markers = "sys_platform == 'darwin'" }
pyfakefs = ">=6.3.2"
pytest = ">=9.2.0"

[tool.poetry.requires-plugins]
poetry-plugin-patch = { path = "poetry/plugin/patch", develop = true }

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]

[tool.ruff]
indent-width = 4
line-length = 80

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
ignore = [
  "UP035",  # import from collections.abc: noisy in existing code
]
select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["poetry_plugin_patch"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export names.
"**/__init__.py" = ["F401"]
