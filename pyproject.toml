[project]
name = "lab"
version = "0.0.0"
description = "R&D Lab"
readme = "README.md"
requires-python = ">=3.15"
license = "BSD-3-Clause"
authors = [{ name = "Samvel Khalatyan", email = "sn.khalatyan@gmail.com" }]

[project.urls]
repository = "https://github.com/skhal/lab"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.poetry]
package-mode = false  # use poetry only for dependency management

[tool.poetry.dependencies]
ansible-core = "^2.21"
pytest = "^9.2.0"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
