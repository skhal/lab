name: CI C++ with Bazel

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      llvm-version:
        required: true
        type: number
      package:
        required: true
        type: string
  # Trigger from other workflows
  workflow_call:
    inputs:
      llvm-version:
        required: true
        type: number
      package:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        shell: sh
    runs-on: ubuntu-latest
    env:
      CC: clang-${{ inputs.llvm-version }}
      CXX: clang++-${{ inputs.llvm-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup LLVM ${{ inputs.llvm-version }}
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x ./llvm.sh
        sudo ./llvm.sh ${{ inputs.llvm-version }}

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: Test
      run: |
        bazel test \
          --keep_going \
          --test_verbose_timeout_warnings \
          --test_output=errors \
          ${{ inputs.package }}/...
