name: CI C++ with Bazel

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      llvm-version:
        required: true
        type: number
      package:
        required: true
        type: string
  # Trigger from other workflows
  workflow_call:
    inputs:
      llvm-version:
        required: true
        type: number
      package:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        shell: sh
    runs-on: ubuntu-latest
    env:
      CC: clang-${{ inputs.llvm-version }}
      CXX: clang++-${{ inputs.llvm-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup LLVM ${{ inputs.llvm-version }}
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        # Ref: https://apt.llvm.org
        LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
      run: |
        set -eu
        codename="$(lsb_release -cs)"
        keyring=/etc/apt/keyrings/apt.llvm.org.gpg

        wget -qO llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
        gpg --show-keys --fingerprint llvm-snapshot.gpg.key | tr -d ' ' | grep -qx "${LLVM_KEY_FINGERPRINT}" || {
          echo "LLVM signing key ${LLVM_KEY_FINGERPRINT} not found" >&2
          exit 1
        }

        sudo install -d -m 0755 /etc/apt/keyrings
        gpg --dearmor <llvm-snapshot.gpg.key | sudo tee "${keyring}" >/dev/null
        rm llvm-snapshot.gpg.key

        repo="https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main"
        echo "deb [signed-by=${keyring}] ${repo}" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null

        sudo apt-get update
        sudo apt-get install -y "clang-${LLVM_VERSION}"

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: Test
      run: |
        bazel test \
          --keep_going \
          --test_verbose_timeout_warnings \
          --test_output=errors \
          ${{ inputs.package }}/...
