name: Ansible CI

on:
  push:
    branches: ["main"]
    paths: ['ansible/**']
  schedule:
  # Everyday Monday at 6:00 UTC
  - cron: '0 6 * * MON'

jobs:
  bootstrap:
    uses: ./.github/workflows/ci_analyze.yml

  ci:
    needs: bootstrap
    if: |
      needs.bootstrap.outputs.py_changes == 'true' ||
        github.event_name == 'schedule'
    strategy:
      matrix:
        python-version: ['3.12', '3.15']
    uses: ./.github/workflows/_ci_python.yml
    with:
      package: ./ansible
      python-version: ${{ matrix.python-version }}
