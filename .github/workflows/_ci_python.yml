name: CI Python

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      python-version:
        required: true
        type: string
      package:
        description: "Folder to run pytest from, relative to the repo root."
        required: true
        type: string
      project:
        description: >-
          Folder with pyproject.toml and poetry.lock to install dependencies from, relative to the repo root.
        type: string
        default: "."
      install-args:
        description: >-
          Extra arguments to poetry install. Use an empty value to install the project itself along with its dependencies.
        type: string
        default: "--no-root"
  # Trigger from other workflows
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      package:
        description: "Folder to run pytest from, relative to the repo root."
        required: true
        type: string
      project:
        description: >-
          Folder with pyproject.toml and poetry.lock to install dependencies from, relative to the repo root.
        type: string
        default: "."
      install-args:
        description: >-
          Extra arguments to poetry install. Use an empty value to install the project itself along with its dependencies.
        type: string
        default: "--no-root"

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        shell: sh
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Poetry must be installed before setup-python to enable dependency cache.
    - name: Install Poetry
      run: pipx install poetry

    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
        cache-dependency-path: ${{ inputs.project }}/poetry.lock

    - name: Install dependencies
      working-directory: ${{ inputs.project }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: poetry install ${INSTALL_ARGS}

    - name: Test
      working-directory: ${{ inputs.package }}
      run: poetry run pytest -v
