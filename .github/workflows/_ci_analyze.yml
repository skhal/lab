name: CI Analyze

on:
  # Trigger from other workflows
  workflow_call:
    inputs:
      base:
        description: >-
          Commit to diff against, e.g. github.event.before of a push. Falls back to the parent of HEAD when empty, all zeros (new branch), or not fetchable (force push).
        type: string
        default: ""
    outputs:
      bzl_changes:
        description: "Bazel changes detected when set to true."
        value: ${{ jobs.analyze.outputs.bzl_changes }}
      cc_changes:
        description: "C++ changes detected when set to true."
        value: ${{ jobs.analyze.outputs.cc_changes }}
      go_changes:
        description: "Go changes detected when set to true."
        value: ${{ jobs.analyze.outputs.go_changes }}
      py_changes:
        description: "Python changes detected when set to true."
        value: ${{ jobs.analyze.outputs.py_changes }}

permissions:
  contents: read

jobs:
  analyze:
    defaults:
      run:
        shell: sh
    runs-on: ubuntu-latest
    outputs:
      bzl_changes: ${{ steps.bzl_changes.outputs.detected }}
      cc_changes: ${{ steps.cc_changes.outputs.detected }}
      go_changes: ${{ steps.go_changes.outputs.detected }}
      py_changes: ${{ steps.py_changes.outputs.detected }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: List Changed Files
      env:
        BASE: ${{ inputs.base }}
      run: |
        base=HEAD^
        case "${BASE}" in
        "" | 0000000000000000000000000000000000000000) ;;
        *)
          if git fetch --no-tags --depth=1 origin "${BASE}"; then
            base="${BASE}"
          fi
          ;;
        esac
        echo "diff base: ${base}"
        git diff --name-only --diff-filter=ACMR "${base}" HEAD | tee "${RUNNER_TEMP}/changed_files"

    - name: Has Bazel Changes
      id: bzl_changes
      run: |
        detected=false
        if grep -q '\(BUILD\|\.bazel\)$' "${RUNNER_TEMP}/changed_files"; then
          detected=true
        fi
        echo "detected=${detected}" | tee $GITHUB_OUTPUT

    - name: Has C++ Changes
      id: cc_changes
      run: |
        detected=false
        if grep -q '\.\(h\|cc\)$' "${RUNNER_TEMP}/changed_files"; then
          detected=true
        fi
        echo "detected=${detected}" | tee $GITHUB_OUTPUT

    - name: Has Go Changes
      id: go_changes
      run: |
        detected=false
        if grep -q '\.go$' "${RUNNER_TEMP}/changed_files"; then
          detected=true
        fi
        echo "detected=${detected}" | tee $GITHUB_OUTPUT

    - name: Has Python Changes
      id: py_changes
      run: |
        detected=false
        if grep -q '\.py$' "${RUNNER_TEMP}/changed_files"; then
          detected=true
        fi
        echo "detected=${detected}" | tee $GITHUB_OUTPUT
