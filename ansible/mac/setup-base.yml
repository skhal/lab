# NAME
#   setup-base • master playbook to setup a local cluster on Mac using HVF
#
# SYNOPSIS
#   ansible-playbook ./setup-base.yml
---
- name: Bootstrap Base
  ansible.builtin.import_playbook: playbooks/bootstrap-base.yml

- name: Init Base
  ansible.builtin.import_playbook: playbooks/init-base.yml

- name: Setup Development Environment
  ansible.builtin.import_playbook: playbooks/init-dev.yml
