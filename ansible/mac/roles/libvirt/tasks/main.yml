---
- name: Hypervisor Framework must be enabled
  block:
    - name: Read HVF from Kernel
      ansible.builtin.command:
        cmd: sysctl -n kern.hv_support
      register: libvirt_check_hvf_task
      changed_when: false
      check_mode: false

    - name: HVF must be enabled
      ansible.builtin.assert:
        that: libvirt_check_hvf_task.stdout | trim == '1'
        fail_msg: HVF is unavailable; kern.hv_support is {{ libvirt_check_hvf_task.stdout | trim }}
        quiet: true

- name: Install libvirt
  community.general.homebrew:
    name: libvirt
    state: present
