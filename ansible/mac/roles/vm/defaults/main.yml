---
# keep-sorted start newline_separated=yes
# vm_base defines base image to use to create the VM. It has the following
# structure:
#   url     string  image URL
#   sha256  string  SHA 256 sum of the image
vm_base: "{{ undef(hint='base image') }}"

# vm_cloud_init triggers image configuration such as add users, set hostname,
# etc. when set. FreeBSD uses nuageinit(7).
vm_cloud_init: {}

# vm_disk_path is the location of VM disks.
vm_disk_path: "{{ undef(hint='vm image store') }}"

# vm_disk_size_gib sets the disk size in GiB.
vm_disk_size_gib: 10

# vm_force_disk re-creates the VM disk when set to true.
#   ansible-playbook -e vm_force_disk=true
vm_force_disk: false

# vm_hostname is the virtual machine's hostname.
vm_hostname: "{{ undef(hint='virtual machine name') }}"

# vm_image_cache_path is the location to cache downloaded images.
vm_image_cache_path: "{{ undef(hint='path to cache dir') }}"

# vm_log_path is the location of VM logs.
vm_log_path: "{{ undef(hint='path to console logs') }}"
# keep-sorted end
