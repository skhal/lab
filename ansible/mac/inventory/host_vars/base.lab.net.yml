---
# keep-sorted start
autoboot_delay_sec: 0
doas_conf:
  - rule: permit nopass :wheel
    description: Permit members of the wheel group to perform actions as root without password.
netif_ifaces:
  vtnet0:
    cidr: 10.0.2.15/24
    desc: egress
pkg_aliases:
  # keep-sorted start
  outdated: "version -vRL="
  vital: 'query -e \"%V=1\" %n'
  # keep-sorted end
pkg_install:
  # keep-sorted start
  - bind-tools
  - doas
  - neovim
  # keep-sorted end
rc_debug: true
rc_info: false
resolver_desc: QEMU SLIRP resolver
resolver_ip: 10.0.2.3
# QEMU uses libslipr to emulate network in user space. It has the following
# default settings:
#   10.0.2.0/24   vnet
#   10.0.2.2      gateway
#   10.0.2.3      DNS resolver (forwarder)
#   10.0.2.15-    DHCP address space
routing_defaultrouter: 10.0.2.2
sysctl_state:
  # keep-sorted start
  kern.randompid: 1
  security.bsd.see_jail_proc: 0
  security.bsd.see_other_gids: 0
  security.bsd.see_other_uids: 0
  security.bsd.unprivileged_proc_debug: 0
  security.bsd.unprivileged_read_msgbuf: 0
  vfs.zfs.vdev.min_auto_ashift: 12
  # keep-sorted end
timezone_name: America/Chicago
user_config:
  op:
    shell: /bin/tcsh
  root:
    shell: /bin/tcsh
# keep-sorted end
