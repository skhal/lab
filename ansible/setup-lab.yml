# NAME
#   setup-lab • master playbook to setup Lab cluster.
#
# SYNOPSIS
#   ansible-playbook -K ./setup-lab.yml
#
# DESCRIPTION
#   setup-lab configures Lab cluster, starting with the host node (a NUC
#   machine), and then proceed to virtual machines setup.
#
#   It lists plays in the expected order of execution, i.e. the N-th play
#   expects upstream plays, 0 to N-1, to be run before.
#
#   Every play has a tag with name matching the imported play name without .yml
#   suffix.
#
#   See playbooks/bootstrap-nuc.yml for reasons to use --ask-become-pass (-K)
#   Ansible flag.
---
# bootstrap-nuc runs minimal configuration of the NUC with bare FreeBSD OS.
- name: Bootstrap NUC
  tags: bootstrap-nuc
  ansible.builtin.import_playbook: playbooks/bootstrap-nuc.yml

# create-jails creates jail skeleton and adds bare thick jails with FreeBSD
# environment.
- name: Create jails
  tags: create-jails
  ansible.builtin.import_playbook: playbooks/create-jails.yml

# bootstrap-jails runs minimal configuration of bare jails.
- name: Bootstrap jails
  tags: bootstrap-jails
  ansible.builtin.import_playbook: playbooks/bootstrap-jails.yml

# create-ca creates a local Central Authority to sign certificates.
- name: Create Certificate Authority (CA)
  tags: create-ca
  ansible.builtin.import_playbook: playbooks/create-ca.yml

# create-dns creates an authoritative and caching servers.
- name: Create Domain Name System (DNS)
  tags: create-dns
  ansible.builtin.import_playbook: playbooks/create-dns.yml

# create-pkg-cache adds a caching PKG server.
- name: Create PKG cache
  tags: create-pkg-cache
  ansible.builtin.import_playbook: playbooks/create-pkg-cache.yml

# create-ldap creates an LDAP server.
- name: Create LDAP
  tags: create-ldap
  ansible.builtin.import_playbook: playbooks/create-ldap.yml

# create-pkg-repo creates Lab pkg(8) repository.
- name: Carete PKG repository.
  tags: create-pkg-repo
  ansible.builtin.import_playbook: playbooks/create-pkg-repo.yml

# bootstrap-devent sets up development environment.
- name: Bootstrap development environment
  tags: bootstrap-devenv
  ansible.builtin.import_playbook: playbooks/bootstrap-devenv.yml
