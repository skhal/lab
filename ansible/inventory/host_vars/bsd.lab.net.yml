---
# keep-sorted start
ansible_jexec_over_ssh_jail_name: bsd
doas_conf:
  - rule: permit nopass :wheel
    description: Permit members of the wheel group to perform actions as root without password.
  - rule: permit skhalatyan as root cmd poudriere
    description: Permit user skhalatyan to run poudriere.
  - rule: permit setenv { PORTSDIR } skhalatyan as root  cmd make args makesum
    description: Permit user skhalatyan to generate distinfo for ports.
openssl_gen_rsa:
  path: /usr/local/etc/poudriere/ssl/pkg.pub
  owner: root
  group: wheel
pkg_install:
  # keep-sorted start
  - FreeBSD-zfs
  - bind-tools
  - doas
  - neovim
  # keep-sorted end
poudriere_conf_allow_make_jobs: true
poudriere_conf_zfs:
  pool: zroot
  dset: zroot/usr/poudriere/bsd.lab.net
poudriere_jail:
  name: 151amd64
  pkgbase_repodir: base_release_1
  pkgbase_uri: pkg+https://freebsd-base.pkg.lab.net
  version: 15
ssh_allow_groups:
  - ssh
ssh_listen_addresses:
  - 10.0.0.101
sysctl_state:
  - name: security.bsd.unprivileged_proc_debug
    value: 1
# keep-sorted end
