---
# keep-sorted start
ansible_jexec_over_ssh_jail_name: pkg
certval_certificates:
  - name: "PKG Certificate"
    path: /usr/local/etc/nginx/ssl/pkg.crt
local_pkg_listen_on: 10.0.0.5
openssl_gen_certs:
  # keep-sorted start
  - name: PKG freebsd-base Cert
    path: "/usr/local/etc/nginx/ssl/pkg.freebsd-base.crt"
    common_name: freebsd-base.pkg.lab.net
    group: www
    owner: www
  - name: PKG freebsd-kmods Cert
    path: "/usr/local/etc/nginx/ssl/pkg.freebsd-kmods.crt"
    common_name: freebsd-kmods.pkg.lab.net
    group: www
    owner: www
  - name: PKG freebsd-ports Cert
    path: "/usr/local/etc/nginx/ssl/pkg.freebsd-ports.crt"
    common_name: freebsd-ports.pkg.lab.net
    group: www
    owner: www
  - name: PKG lab-ports Cert
    path: "/usr/local/etc/nginx/ssl/pkg.lab-ports.crt"
    common_name: lab-ports.pkg.lab.net
    group: www
    owner: www
  # keep-sorted end
ssh_listen_addresses:
  - 10.0.0.5
# keep-sorted end
