---
# keep-sorted start
ansible_jexec_over_ssh_jail_name: ldap
certval_certificates:
  - name: "OpenLDAP Certificate"
    path: /usr/local/etc/openldap/ssl/ldap.crt
openldap_server_addr: 10.0.0.3
openldap_server_bind_dn: cn=op,dc=lab,dc=net
openldap_server_uri: ldap://ldap.lab.net
openssl_gen_certs:
  - name: OpenLDAP Cert
    path: "/usr/local/etc/openldap/ssl/ldap.crt"
    owner: ldap
    group: ldap
ssh_listen_addresses:
  - 10.0.0.3
# keep-sorted end
