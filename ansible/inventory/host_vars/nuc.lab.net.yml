---
# keep-sorted start
jail_allow_chflags: true
jail_bridge: bridge0
jail_defaultrouter: 10.0.0.1
jail_skel_migrate_users:
  - "{{ ansible_user }}"
jail_skel_packages:
  # keep-sorted start
  - FreeBSD-csh # for /bin/tcsh
  - FreeBSD-runtime # for /etc/os-release
  - doas
  - neovim
  # keep-sorted end
jail_skel_zfs_dataset: zroot/usr/jail/15.1
netif_bridges:
  - name: bridge0
    cidr: 10.0.0.1/24
    desc: jail:int
netif_ifaces:
  - name: igc0
    cidr: 192.168.10.101/24
pflog_enable: true
rc_remove:
  - dumpdev
rc_update:
  # keep-sorted start
  - name: rc_debug
    value: true
  - name: rc_info
    value: true
  # keep-sorted end
routing_defaultrouter: 192.168.10.1
ssh_listen_addresses:
  - 192.168.10.101
  - 10.0.0.1
sysctl_state:
  # keep-sorted start
  kern.randompid: 1
  security.bsd.see_jail_proc: 0
  security.bsd.see_other_gids: 0
  security.bsd.see_other_uids: 0
  security.bsd.unprivileged_proc_debug: 0
  security.bsd.unprivileged_read_msgbuf: 0
  vfs.zfs.vdev.min_auto_ashift: 12
  # keep-sorted end
zfs_create_dsets:
  # keep-sorted start
  zroot/usr/jail/bsd/poudriere:
    jailed: "on"
  zroot/usr/jail/pkgbuild/poudriere:
    jailed: "on"
  zroot/usr/packages:
  zroot/var/cache/pkg.freebsd-base:
  zroot/var/cache/pkg.freebsd-kmods:
  zroot/var/cache/pkg.freebsd-ports:
  # keep-sorted end
# sync with users in ldap
zfs_mkhomedir_users:
  - name: skhalatyan
    uid: 10001
    gid: 10001
# keep-sorted end
