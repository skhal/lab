---
# keep-sorted start newline_separated=yes
# resolver_desc is optional comment for the resolver. It goes right before the
# `nameserver ...` line in /etc/resolv.conf.
resolver_desc: ""

# resolver_ip is the nameserver IPv4 address.
resolver_ip: "{{ undef(hint='DNS resolver') }}"
# keep-sorted end
