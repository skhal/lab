# NAME
#   bootstrap-nuc • minimal configuration of freshly installed FreeBSD on NUC.
#
# SYNOPSIS
#   ansible-playbook -K ./playbooks/bootstrap-nuc.yml
#
# DESCRIPTION
#   bootstrap-nuc performs minimal configuration of NUC with fresh installation
#   of FreeBSD OS.
#
#   Use --ask-become-pass (-K) flag to supply Ansible user password to escalate
#   privileges for su(1).
---
# bootstrap-ansible installs Python and doas(1) to run commands with escalated
# privileges without --ask-become-pass.
- name: Bootstrap for Ansible
  hosts: nuc.lab.net
  tags: bootstrap-ansible
  # The system is minimal, use su(1) to escalate privileges.
  become_method: ansible.builtin.su
  roles:
    - role: bootstrap

- name: Configure services
  hosts: nuc.lab.net
  tags: bootstrap-services
  roles:
    # keep-sorted start
    - role: hostname
    - role: ntp
    - role: periodic
    - role: pkg
    - role: rc
    - role: syslog
    - role: timezone
    - role: zfs
    # keep-sorted end

- name: Bootstrap users
  hosts: nuc.lab.net
  tags: bootstrap-users
  roles:
    # keep-sorted start
    - role: doas
    - role: user
    - role: zfs_mkhomedir
    # keep-sorted end

- name: Configure network
  hosts: nuc.lab.net
  tags: bootstrap-network
  roles:
    - role: routing
    - role: netif

- name: Configure firewall
  hosts: nuc.lab.net
  tags: bootstrap-firewall
  roles:
    - role: pflog
    - role: pf

- name: Configure remote access
  hosts: nuc.lab.net
  tags: bootstrap-remote-access
  roles:
    - role: ssh
