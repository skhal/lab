# NAME
#   bootstrap-nuc • prepare NUC for Ansible automation.
#
# SYNOPSIS
#   ansible-playbook -K ./playbooks/bootstrap-nuc.yml
#
# DESCRIPTION
#   bootstrap-nuc prepares NUC for Ansible automation.
---
# bootstrap-ansible installs Python and doas(1) to run commands with escalated
# privileges without --ask-become-pass.
- name: Bootstrap for Ansible
  hosts: nuc.lab.net
  # The system is minimal, use su(1) to escalate privileges.
  become_method: ansible.builtin.su
  roles:
    - role: bootstrap
