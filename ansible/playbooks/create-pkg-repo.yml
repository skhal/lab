---
- name: Tune jail params
  hosts: nuc.lab.net
  tags: create-pkg-repo-jail
  tasks:
    - name: Set jail parameters
      vars:
        jail_name: pkgbuild
        jail_conf:
          allow_mlock: true
          allow_mount: true
          allow_mount_devfs: true
          allow_mount_linprocfs: true
          allow_mount_nullfs: true
          allow_mount_procfs: true
          allow_mount_tmpfs: true
          children_max: 100
          enforce_statfs: 1
      ansible.builtin.include_role:
        name: jail
        tasks_from: set_params.yml

- name: Generate certificate
  hosts: pkgbuild.lab.net
  tags: create-pkg-repo-cert
  roles:
    - role: openssl_gen

- name: Create PKG builder
  hosts: pkgbuild.lab.net
  tags: create-pkg-repo-build
  roles:
    - role: poudriere

- name: Install PKG repository
  hosts: all
  tags: create-pkg-repo-install
  tasks:
    - name: Fetch public key
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

    - name: Install repository
      vars:
        local_pkg_repos:
          - name: lab-ports
            conf: lab-ports.conf
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
