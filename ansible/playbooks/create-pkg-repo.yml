---
- name: Build PKG repository
  hosts: pkgbuild.lab.net
  tags: create-pkg-repo-build
  roles:
    - role: openssl_gen
    - role: poudriere

- name: Install PKG repository
  hosts: all
  tags: create-pkg-repo-install
  tasks:
    - name: Fetch public key
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa_fetch

    - name: Install repository
      vars:
        local_pkg_repos:
          - name: lab-ports
            conf: lab-ports.conf
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
