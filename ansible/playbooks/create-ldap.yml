# NAME
#   create-ldap • setup OpenLDAP server
#
# SYNOPSIS
#   ansible-playbook ./playbooks/create-ldap.yml
#
# DESCRIPTION
#   create-ldap sets up an OpenLDAP server with TLS and integrates PAM with
#   LDAP on cluster.
#
#   Run `openldap_server` role to install OpenLDAP and create `ldap:ldap` user
#   before `openssl_gen` role to generate a TLS certificate owned by
#   `ldap:ldap` user.
---
- name: Create LDAP server
  hosts: ldap.lab.net
  tags: create-ldap-server
  roles:
    - role: openldap_server
    - role: openssl_gen

- name: Add LDAP entries
  hosts: ldap.lab.net
  tags: create-ldap-db
  tasks:
    - name: Add entries
      ansible.builtin.include_role:
        name: openldap_server
        tasks_from: add_entries
    - name: Set passwords
      ansible.builtin.include_role:
        name: openldap_server
        tasks_from: set_passwords

- name: Configure PAM with LDAP
  hosts: jails
  tags: create-ldap-pam
  roles:
    - role: openldap_client
    - role: pam_ldap
