# NAME
#   create-ldap • setup OpenLDAP server
#
# SYNOPSIS
#   ansible-playbook ./playbooks/create-ldap.yml
#
# DESCRIPTION
#   create-ldap sets up an OpenLDAP server with TLS and integrates PAM with
#   LDAP on cluster.
#
#   Run `openldap_server` role to install OpenLDAP and create `ldap:ldap` user
#   before `openssl_gen` role to generate a TLS certificate owned by
#   `ldap:ldap` user.
---
- name: Create LDAP server
  hosts: ldap.lab.net
  tags: create-ldap-server
  roles:
    - role: openldap_server
    - role: openssl_gen

- name: Add LDAP entries
  hosts: ldap.lab.net
  tags: create-ldap-db
  tasks:
    - name: Add entries
      ansible.builtin.include_role:
        name: openldap_server
        tasks_from: add_entries
    - name: Set passwords
      ansible.builtin.include_role:
        name: openldap_server
        tasks_from: set_passwords

- name: Configure PAM with LDAP
  hosts: jails,!infra
  tags: create-ldap-pam
  roles:
    - role: openldap_client
    - role: pam_ldap
  post_tasks:
    - name: Update jail configuration
      vars:
        openldap_client_jail_control_host: nuc.lab.net
      block:
        - name: Mount user home folder
          ansible.builtin.include_role:
            name: openldap_client
            tasks_from: mount_homedir

        - name: Add jail dependency
          vars:
            jail_name: "{{ inventory_hostname_short }}"
            jail_depend:
              - ldap
          ansible.builtin.include_role:
            name: jail
            tasks_from: add_deps.yml
          args:
            apply:
              delegate_to: "{{ openldap_client_jail_control_host }}"
