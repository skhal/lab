# NAME
#   init-dev • setup development environment
#
# SYNOPSIS
#   ansible-playbook ./playbooks/init-dev.yml
#
# DESCRIPTION
#   init-dev configures userland for development.
---
- name: Tune jail params
  hosts: nuc.lab.net
  tags: init-dev-jail
  tasks:
    - name: Set jail parameters
      loop: "{{ query('inventory_hostnames', 'dev') }}"
      loop_control:
        loop_var: _item_hostname
      vars:
        jail_name: "{{ _item_hostname | split('.') | first }}"
        jail_conf:
          allow_chflags: true
      ansible.builtin.include_role:
        name: jail
        tasks_from: set_params.yml

- name: Install packages
  hosts: dev
  tags: init-dev-pkg
  vars_files:
    - vars/dev.yml
  roles:
    - role: pkg

