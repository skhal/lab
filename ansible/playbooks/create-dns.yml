# NAME
#   create-dns • setup authoritative and caching DNS servers
#
# SYNOPSIS
#   ansible-playbook ./playbooks/create-dns.yml
#
# DESCRIPTION
#   create-dns sets up an authoritative name server with TLS.
#
#   Then, it adds a caching name server on every node in the cluster with
#   redirects to the authoritative name server for `*.lab.net` zone.
#
#   User `bind:bind` owns TLS certificate. The user does not exist until `bind`
#   role installs package `bind`. Run it before `openssl_gen` to generate a
#   certificate.
#
#   A restart of the authoritative name server flushes the zones from the cache
#   of every caching name server in the cluster.
---
- name: Create authoritative name server
  hosts: dns.lab.net
  tags: create-dns-auth
  roles:
    - role: bind
    - role: openssl_gen

- name: Configure caching name server
  hosts: all
  tags: create-dns-cache
  roles:
    - role: local_unbound
  post_tasks:
    - name: Flush zones from cache
      when:
        - hostvars['dns.lab.net'].bind_restarted | default(false)
      become: true
      ansible.builtin.command:
        cmd: local-unbound-control flush_zone {{ item }}
      loop: "{{ hostvars['dns.lab.net'].bind_zones }}"
      changed_when: true

    - name: Add jail dependency
      when:
        - inventory_hostname_short not in ['nuc', 'dns']
      vars:
        jail_name: "{{ inventory_hostname_short }}"
        jail_depend:
          - dns
      ansible.builtin.include_role:
        name: jail
        tasks_from: add_deps.yml
      args:
        apply:
          delegate_to: nuc.lab.net
