# NAME
#   create-pkg-cache • create a caching PKG server
#
# SYNOPSIS
#   ansible-playbook ./playbooks/create-pkg-cache.yml
#
# DESCRIPTION
#   create-pkg-cache creates a caching PKG server for FreeBSD repositories
#   (base, Kernel modules, ports) and configures the cluster to use it instead
#   of FreeBSD repos.
---
- name: Generate certificate
  hosts: pkg.lab.net
  tags: create-pkg-cache-cert
  roles:
    - role: openssl_gen

- name: Create caching PKG server
  hosts: pkg.lab.net
  tags: create-pkg-cache-server
  roles:
    - role: local_pkg

- name: Configure PKG repos
  hosts: all
  tags: create-pkg-cache-repos
  vars:
    local_pkg_repos:
      # keep-sorted start
      - name: freebsd-base
        conf: freebsd-base.conf
        orig: FreeBSD-base
      - name: freebsd-kmods
        conf: freebsd-kmods.conf
        orig: FreeBSD-ports-kmods
      - name: freebsd-ports
        conf: freebsd-ports.conf
        orig: FreeBSD-ports
      # keep-sorted end
  tasks:
    - name: Add repos
      ansible.builtin.include_role:
        name: local_pkg
        tasks_from: configure_repos
