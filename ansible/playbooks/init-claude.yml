---
- name: Enable Linux emulation
  hosts: nuc.lab.net
  tags: claude-linux
  roles:
    - linux

- name: Tune jail params
  hosts: nuc.lab.net
  tags: claude-jail
  tasks:
    - name: Set jail parameters
      vars:
        jail_name: bsd
        jail_conf:
          allow_mlock: true
          allow_mount: true
          allow_mount_devfs: true
          allow_mount_linprocfs: true
          allow_mount_nullfs: true
          allow_mount_procfs: true
          allow_mount_tmpfs: true
          enforce_statfs: 1
      ansible.builtin.include_role:
        name: jail
        tasks_from: set_params.yml

- name: Install Claude Code
  hosts: bsd.lab.net
  tags: claude-pkg
  vars:
    pkg_install:
      # keep-sorted start
      - claude-code
      - gh
      # keep-sorted end
  roles:
    - pkg
