---
- name: Configure powerd
  vars:
    _rc_var: powerd_enable
    _rc_file: /etc/rc.conf.d/powerd
  block:
    - name: Clean /etc/rc.conf
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        state: absent

    - name: Enable service
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        value: true
        path: "{{ _rc_file }}"

- name: Start powerd service
  become: true
  ansible.builtin.service:
    name: powerd
    state: started
