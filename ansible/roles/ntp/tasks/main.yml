---
- name: RC config NTP
  vars:
    _rc_vars:
      ntpd_enable: true
      ntpd_sync_on_start: true
  loop: "{{ _rc_vars | dict2items }}"
  loop_control:
    loop_var: _rc_var
  ansible.builtin.include_tasks: _update_rc.yml

- name: Update config
  notify: "ntp_restart_server"
  loop:
    - interface ignore wildcard
    - interface listen 127.0.0.1
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ntp.conf
    line: "{{ item }}"

- name: Start NTP server
  become: true
  ansible.builtin.service:
    name: ntpd
    state: started
