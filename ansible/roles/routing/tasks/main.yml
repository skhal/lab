---
- name: Configure default route
  vars:
    _rc_file: /etc/rc.conf.d/routing
    _rc_var: defaultrouter
  block:
    - name: Remove from /etc/rc.conf
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        state: absent

    - name: Set hostname in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        value: "{{ routing_defaultrouter }}"
        path: "{{ _rc_file }}"
      notify: "routing_restart_service"

- name: "Enable gateway"
  become: true
  community.general.sysrc:
    name: gateway_enable
    value: "{{ routing_gateway_enable }}"
    path: /etc/rc.conf.d/routing
  notify: "routing_restart_service"
