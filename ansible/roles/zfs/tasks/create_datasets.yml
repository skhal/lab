---
- name: Create datasets
  loop: "{{ zfs_datasets }}"
  vars:
    _dset:
      name: "{{ item.name }}"
      props: "{{ item | combine({'name': omit}) or omit }}"
  ansible.builtin.include_tasks: _create_dataset.yml
