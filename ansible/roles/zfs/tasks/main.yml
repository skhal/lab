---
- name: Configure ZFS service
  vars:
    _rc_file: /etc/rc.conf.d/zfs
  block:
    - name: Clean /etc/rc.conf
      become: true
      community.general.sysrc:
        name: zfs_enable
        state: absent

    - name: Enable ZFS service in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: zfs_enable
        value: true
        path: "{{ _rc_file }}"

- name: Start ZFS service
  become: true
  ansible.builtin.service:
    name: zfs
    state: started
