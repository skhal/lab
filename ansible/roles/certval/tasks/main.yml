---
- name: Install certval
  become: true
  community.general.pkgng:
    name: lab-certval
    state: present

# The package installs files with the lab- prefix, including the configuration
# file <prefix>/etc/lab-certval.txtpb. See sysutils/lab-certval in Lab ports.
- name: Configure certval
  vars:
    _conf_file: /usr/local/etc/lab-certval.txtpb
  become: true
  block:
    - name: Install configuration file
      ansible.builtin.template:
        src: "{{ _conf_file | trim('/') }}.j2"
        dest: "{{ _conf_file }}"
        owner: root
        group: wheel
        mode: u=rw,g=,o=

    - name: Run daily
      ansible.builtin.cron:
        name: "validate certificates"
        special_time: daily
        job: "/usr/local/bin/lab-certval -c {{ _conf_file }}"
