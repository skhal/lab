---
# keep-sorted start newline_separated=yes
# poudriere_prefix is the location of POUDRIERE_DATA
poudriere_basefs: /usr/local/poudriere

# poudriere_bootstrap bootstraps a repository catalog using provided overlay
# and a package. It has the following structure:
#   overlay string  overlay ports tree name (must be available in
#                   `poudriere-ports -l`)
#   package string  package to build
poudriere_bootstrap: "{{ undef(hint='create packages catalog when set') }}"

# poudriere_cert is the path to TLS certificate for Nginx.
poudriere_cert: "{{ undef(hint='nginx TLS certificate') }}"

# poudriere_cert_key is the path to TLS certificate private key for Nginx.
poudriere_cert_key: "{{ undef(hint='nginx TLS certificate private key') }}"

# poudriere_jail configures jail to be used by poudriere-jail(8) to build
# packages. It is expected to have the following structure:
#   name    string  jail name, e.g. 151amd64 for OS version 15.1-RELEASE
#   version string  FreeBSD version without patch
#                   (see -v flag in poudriere-jail(8)).
poudriere_jail: "{{ undef(hint='poudriere jail name and version') }}"

# poudriere_port_trees lists port trees to git-clone and import into poudriere.
# Each item has the following structure:
#   name  string  the port tree name
#   repo  string  the port tree repository URL, e.g. https://github.com/a/b.git
#   path  string? the path inside the repository to the ports else none
poudriere_port_trees: []

# poudriere_web_access configures https://localhost to poudriere builds when
# set to true.
poudriere_web_access: false
# keep-sorted end
