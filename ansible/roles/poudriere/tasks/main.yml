---
- name: Install poudriere
  become: true
  community.general.pkgng:
    name:
      # keep-sorted start
      - FreeBSD-clibs-dev
      - FreeBSD-jail # for /usr/sbin/{jail,jls}
      - FreeBSD-runtime # for /sbin/sysctl
      - git
      - poudriere-devel # works better with jails than poudriere
      # keep-sorted end
    state: present

- name: Configure poudriere
  vars:
    _conf_file: /usr/local/etc/poudriere.conf
    _distfile_cache_path: /usr/ports/distfiles
  block:
    - name: Create distfiles cache
      become: true
      ansible.builtin.file:
        path: "{{ _distfile_cache_path }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Generate RSA keys
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa

    - name: Update {{ _conf_file }}
      vars:
        _signing_key: >-
          {{
            (
              openssl_gen_rsa.path | dirname,
              'private',
              openssl_gen_rsa.path | basename | splitext | first
            ) | path_join
          }}.key
      block:
        - name: Set signing key
          become: true
          ansible.builtin.lineinfile:
            path: "{{ _conf_file }}"
            regexp: "^#PKG_REPO_SIGNING_KEY="
            line: "PKG_REPO_SIGNING_KEY={{ _signing_key }}"

        - name: Enable ccache
          become: true
          ansible.builtin.lineinfile:
            path: "{{ _conf_file }}"
            regexp: "^#\\s*(CCACHE_DIR=.*)$"
            backrefs: true
            line: "\\1"

        - name: Allow make jobs
          become: true
          when: poudriere_conf_allow_make_jobs is defined and poudriere_conf_allow_make_jobs
          ansible.builtin.lineinfile:
            path: "{{ _conf_file }}"
            regexp: "^#\\s*(ALLOW_MAKE_JOBS=.*)$"
            backrefs: true
            line: "\\1"

        - name: Limit the number of workers
          become: true
          when: poudriere_conf_parallel_jobs is defined
          ansible.builtin.lineinfile:
            path: "{{ _conf_file }}"
            regexp: "^#\\s*(PARALLEL_JOBS=.*)$"
            line: "PARALLEL_JOBS={{ poudriere_conf_parallel_jobs }}"

        - name: Allow parallel make
          become: true
          when: poudriere_conf_allow_make_jobs_packages is defined
          ansible.builtin.lineinfile:
            path: "{{ _conf_file }}"
            regexp: "^#\\s*(ALLOW_MAKE_JOBS_PACKAGES=.*)$"
            line: "ALLOW_MAKE_JOBS_PACKAGES=\"{{ poudriere_conf_allow_make_jobs_packages | join(' ') }}\""

- name: Create port trees
  block:
    - name: Create default ports tree
      vars:
        _port_tree: default
      block:
        - name: Check port tree {{ _port_tree }}
          ansible.builtin.shell:
            cmd: |
              set -o pipefail;
              poudriere ports -l -n \
                | grep -q '^{{ _port_tree }}$'
          ignore_errors: true
          changed_when: false
          register: poudriere_check_port_tree_task

        - name: Create port tree {{ _port_tree }}
          when: poudriere_check_port_tree_task.rc != 0
          become: true
          ansible.builtin.command:
            cmd: poudriere ports -c
          register: poudriere_create_port_tree_task
          changed_when: poudriere_create_port_tree_task is succeeded

    - name: Create overlay port trees
      loop: "{{ poudriere_port_trees }}"
      loop_control:
        loop_var: _port_tree
      ansible.builtin.include_tasks: _create_port_tree.yml

- name: Create jail
  ansible.builtin.include_tasks: _create_jail.yml

- name: Setup web access
  when: poudriere_web_access is defined
  ansible.builtin.include_tasks: _setup_web_access.yml

- name: Bootstrap repository catalogue
  when: poudriere_bootstrap is defined
  become: true
  ansible.builtin.shell:
    cmd: |
      poudriere bulk \
        -j {{ poudriere_jail.name }} \
        -O {{ poudriere_bootstrap.overlay }} \
        {{ poudriere_bootstrap.package }}
  register: poudriere_bootstrap_repo_catalogue_task
  changed_when: poudriere_bootstrap_repo_catalogue_task is succeeded

- name: Link ABI
  when: poudriere_abi_link is defined
  become: true
  vars:
    _prefix: "{{ (poudriere_basefs, 'data', 'packages') | path_join }}"
  ansible.builtin.file:
    # the link is relative to the destination
    src: "{{ poudriere_abi_link.src }}"
    dest: "{{ (_prefix, poudriere_abi_link.dst) | path_join }}"
    owner: root
    group: wheel
    state: link
