---
- name: Install poudriere
  become: true
  community.general.pkgng:
    name:
      # keep-sorted start
      - FreeBSD-clibs-dev
      - FreeBSD-jail # for /usr/sbin/{jail,jls}
      - FreeBSD-runtime # for /sbin/sysctl
      - git
      - poudriere-devel # works better with jails than poudriere
      # keep-sorted end
    state: present

- name: Configure poudriere
  vars:
    _conf_file: /usr/local/etc/poudriere.conf
    _distfile_cache_path: /usr/ports/distfiles
  block:
    - name: Create distfiles cache
      become: true
      ansible.builtin.file:
        path: "{{ _distfile_cache_path }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Generate RSA keys
      ansible.builtin.include_role:
        name: openssl_gen
        tasks_from: rsa

    - name: Configure
      become: true
      vars:
        _pkg_repo_signing_key: >-
          {{
            (
              openssl_gen_rsa.path | dirname,
              'private',
              openssl_gen_rsa.path | basename | splitext | first
            ) | path_join
          }}.key
      ansible.builtin.template:
        src: "{{ _conf_file | trim('/') }}.j2"
        dest: "{{ _conf_file }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r

- name: Create port trees
  block:
    - name: Create default ports tree
      vars:
        _port_tree: default
      block:
        - name: Check port tree {{ _port_tree }}
          ansible.builtin.shell:
            cmd: |
              set -o pipefail;
              poudriere ports -l -n \
                | grep -q '^{{ _port_tree }}$'
          ignore_errors: true
          changed_when: false
          register: poudriere_check_port_tree_task

        - name: Create port tree {{ _port_tree }}
          when: poudriere_check_port_tree_task.rc != 0
          become: true
          ansible.builtin.command:
            cmd: poudriere ports -c
          register: poudriere_create_port_tree_task
          changed_when: poudriere_create_port_tree_task is succeeded

    - name: Create overlay port trees
      loop: "{{ poudriere_port_trees }}"
      loop_control:
        loop_var: _port_tree
      ansible.builtin.include_tasks: _create_port_tree.yml

- name: Create jail
  ansible.builtin.include_tasks: _create_jail.yml

- name: Setup web access
  when: poudriere_web_access
  ansible.builtin.include_tasks: _setup_web_access.yml

- name: Bootstrap repository catalogue
  when: poudriere_bootstrap is defined
  become: true
  ansible.builtin.shell:
    cmd: |
      poudriere bulk \
        -j {{ poudriere_jail.name }} \
        -O {{ poudriere_bootstrap.overlay }} \
        {{ poudriere_bootstrap.package }}
  register: poudriere_bootstrap_repo_catalogue_task
  changed_when: poudriere_bootstrap_repo_catalogue_task is succeeded
