---
- name: Configure users
  loop: "{{ user_config | dict2items }}"
  loop_control:
    loop_var: _item_user
  vars:
    _user:
      name: "{{ _item_user.key }}"
      group: >-
        {% if _item_user.key == "root" %}
          wheel
        {% else %}
          {{ _item_user.key }}
        {% endif %}
      shell: "{{ _item_user.value.shell | default('/bin/sh') }}"
      home: >-
        {% if _item_user.key == "root" %}
          /root
        {% else %}
          /home/{{ _item_user.key }}
        {% endif %}
  ansible.builtin.include_tasks: "_config_user.yml"
