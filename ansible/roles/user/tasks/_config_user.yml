---
- name: Update shell
  become: true
  ansible.builtin.user:
    name: "{{ _user.name }}"
    shell: "{{ _user.shell }}"
    state: present

- name: Copy skeleton
  block:
    - name: Check skeleton files
      ansible.builtin.shell:
        cmd: >
          for f in /usr/share/skel/dot.*; do
            target="{{ _user.home }}/${f##*/dot}"
            [ -e "${target}" ] || echo ${target}: no such file
          done
      register: user_check_skel_task
      changed_when: false

    - name: Copy skeleton
      when: '"no such file" in user_check_skel_task.stdout'
      become: true
      ansible.builtin.command:
        cmd: /usr/sbin/pw usermod -m -n {{ _user.name }}
      register: user_copy_skel_task
      changed_when: user_copy_skel_task.rc == 0

- name: Copy Lab skeleton
  vars:
    _user_skel_pattern: >-
      {{
        [
          _user.home,
          "dot.*"
        ] | path_join
      }}
  loop: "{{ query('fileglob', _user_skel_pattern, wantlist=True) | sort }}"
  loop_control:
    loop_var: _file
  become: true
  ansible.builtin.copy:
    src: "{{ _file }}"
    dest: >-
      {{
        [
          _user.home,
          _file
            | basename
            | regex_replace('^dot', '', count=1)
        ] | path_join
      }}
    owner: "{{ _user.name }}"
    group: "{{ _user.group }}"
    mode: u=rw,g=r,o=r
