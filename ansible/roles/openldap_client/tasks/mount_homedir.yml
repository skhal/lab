---
# Run the task on the server that manages jails.
- name: Mount user home folders
  when: openldap_client_hostnames is defined
  block:
    - name: Collect users
      ansible.builtin.shell:
        cmd: |
          set -eo pipefail
          ldapsearch \
              -x \
              -ZZ \
              -b 'ou=people,dc=lab,dc=net' \
              -LLL \
              '(&(homedirectory=*)(!(uid=op)))' \
              homedirectory \
            | grep homeDirectory: \
            | cut -d ' ' -f 2
      changed_when: false
      ignore_errors: true
      register: openldap_client_list_user_homes_task

    - name: Mount users
      when:
        - openldap_client_list_user_homes_task is succeeded
        - openldap_client_list_user_homes_task.stdout_lines | length > 0
      loop: "{{ openldap_client_hostnames }}"
      loop_control:
        loop_var: _item_hostname
      vars:
        jail_name: "{{ _item_hostname | split('.') | first }}"
        jail_mounts: >
          {{
            dict(
              openldap_client_list_user_homes_task.stdout_lines
                | zip(
                    [{}] * (
                      openldap_client_list_user_homes_task.stdout_lines | length
                    )
                  )
            )
          }}
      ansible.builtin.include_role:
        name: jail
        tasks_from: add_mounts.yml
