---
- name: Configure hostname
  vars:
    _rc_file: /etc/rc.conf.d/hostname
  block:
    - name: Remove hostname from /etc/rc.conf
      become: true
      community.general.sysrc:
        name: hostname
        state: absent

    - name: Set hostname in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: hostname
        value: "{{ inventory_hostname }}"
        path: "{{ _rc_file }}"
