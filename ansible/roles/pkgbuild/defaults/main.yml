---
# keep-sorted start newline_separated=yes
# pkgbuild_jail is the name of poudriere jail to run the build.
pkgbuild_jail: "{{ undef(hint='poudriere jail for build') }}"

# pkgbuild_overlay is the name of the overlay ports tree.
pkgbuild_overlay: "{{ undef(hint='overlay ports tree') }}"

# pkgbuild_ports is the list of ports to build.
pkgbuild_ports: "{{ undef(hint='list of ports to build') }}"
# keep-sorted end
