---
- name: Configure interfaces
  loop: "{{ netif_ifaces | dict2items }}"
  loop_control:
    loop_var: _iter_iface
    label: "{{ _iter_iface.key }}"
  vars:
    _iface: >
      {{
        _iter_iface.value
          | combine({'name': _iter_iface.key})
      }}
  ansible.builtin.include_tasks: "_config_iface.yml"

- name: Configure bridges
  ansible.builtin.include_tasks: "_ifconfig_bridge.yml"
  loop: "{{ netif_bridges }}"
  loop_control:
    label: "{{ _bridge.name }}"
    loop_var: _bridge
