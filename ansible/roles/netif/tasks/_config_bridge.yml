---
- name: "Update /etc/rc.conf.d/network"
  vars:
    _rc_file: /etc/rc.conf.d/network
  block:
    - name: Clone {{ _bridge.name }}
      become: true
      community.general.sysrc:
        path: "{{ _rc_file }}"
        name: cloned_interfaces
        value: "{{ _bridge.name }}"
        state: value_present
      notify: "netif_restart_service"

    - name: Configure {{ _bridge.name }}
      become: true
      community.general.sysrc:
        path: "{{ _rc_file }}"
        name: ifconfig_{{ _bridge.name }}
        # noqa jinja[spacing]
        value: >-
          inet {{ _bridge.cidr }}
          {%- for m in _bridge.get('addm', []) %} addm {{ m }}{% endfor %}
          up
          {%- if 'desc' in _bridge %} descr {{ _bridge.desc }}{% endif %}
      notify: "netif_restart_service"
