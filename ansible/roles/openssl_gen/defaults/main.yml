---
# keep-sorted start newline_separated=yes
# openssl_gen_certs lists certificates to generate. Each certificate has the
# following structure:
#   name  string  certificate name for logging purposes
#   path  string  path to .crt file
#   key   string? optional path to the private key.
#                 Default:
#                   if   path=/path/<cert>.crt
#                   then key =/path/private/<cert>.key
#   owner string? optional user to own the certificate and folders.
#                 See description in:
#                   ansible.builtin.file
#                   community.crypto.openssl_privatekey
#   group string? optional user group to own the certificate and folders.
#                 See description in:
#                   ansible.builtin.file
#                   community.crypto.openssl_privatekey
#   cn    string? optional common name. Default `hostname`
#   san   string* an optional list of subject alternative names
openssl_gen_certs: []

# openssl_gen_rsa defines RSA key to generate. It expects the following
# structure:
#   - path  string  file name with path to store public key. The private key
#                   will reside at the same path under private/ sub-folder,
#                   with the same name and .key extension.
#   - owner         user to own the keys
#   - group         group to own the keys
openssl_gen_rsa: "{{ undef(hint='RSA public certificate info') }}"

# openssl_gen_rsa_fetch defines RSA public key to fetch. It expects the
# following structure:
#   - source  string  path to the remote public key in the form host:/path
#   - target  string  path to the public key to save
openssl_gen_rsa_fetch: "{{ undef(hint='RSA public key source and targets') }}"
# keep-sorted end
