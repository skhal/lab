---
# keep-sorted start
# openssl_gen_common_name certificate's common name.
openssl_gen_common_name: ""
# openssl_gen_crt is the certificate file to generate including path.
openssl_gen_crt: ""
# openssl_gen_group is the group ownership for the certificate.
openssl_gen_group: "wheel"
# openssl_gen_key is the certificate's private key file to generate including
# path. Default is /path/private/<cert>.key for the certificate at
# /path/<cert>.crt set in openssl_gen_crt.
openssl_gen_key: ""
# openssl_gen_owner is the user owner for the certificate.
openssl_gen_owner: "root"
# openssl_gen_rsa defines RSA key to generate. It expects the following
# structure:
#   - path  string  file name with path to store public key. The private key
#                   will reside at the same path under private/ sub-folder,
#                   with the same name and .key extension.
#   - owner         user to own the keys
#   - group         group to own the keys
openssl_gen_rsa: "{{ undef(hint='RSA public certificate info') }}"
# openssl_gen_rsa_fetch defines RSA public key to fetch. It expects the
# following structure:
#   - source  string  path to the remote public key in the form host:/path
#   - target  string  path to the public key to save
openssl_gen_rsa_fetch: "{{ undef(hint='RSA public key source and targets') }}"
# keep-sorted end
