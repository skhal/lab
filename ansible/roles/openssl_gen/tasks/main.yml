---
- name: Install package
  become: true
  community.general.pkgng:
    name:
      - FreeBSD-openssl
      - py312-cryptography
    state: present

- name: "Generate certificates"
  loop: "{{ openssl_gen_certs }}"
  loop_control:
    loop_var: _cert
  ansible.builtin.include_tasks: _gen_cert.yml
