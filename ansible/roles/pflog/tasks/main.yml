---
- name: Enable pflog
  vars:
    _rc_file: /etc/rc.conf.d/hostname
    _rc_var: pflog_enable
  block:
    - name: Clean /etc/rc.conf
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        state: absent

    - name: Enable pflog in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        value: true
        path: "{{ _rc_file }}"

- name: Start pflog service
  become: true
  ansible.builtin.service:
    name: pflog
    state: started
