---
# keep-sorted start newline_separated=true
# pkg_aliases maps pkg-alias(8) to a pkg(8) command where keys are alias names
# and values are aliased commands.
pkg_aliases: "{{ undef(hint='pkg-alias commands') }}"

# pkg_install lists packages to install.
pkg_install: "{{ undef(hint='a list of packages to install') }}"
# keep-sorted end
