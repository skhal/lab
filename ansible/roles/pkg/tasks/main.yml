---
- name: Configure repositories
  become: true
  vars:
    _conf_file: /usr/local/etc/pkg/repos/FreeBSD.conf
  block:
    - name: Create folder {{ _conf_file | dirname }}
      ansible.builtin.file:
        path: "{{ _conf_file | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Use latest branch
      ansible.builtin.copy:
        src: "{{ _conf_file | trim('/') }}"
        dest: "{{ _conf_file }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r

- name: Upgrade packages
  become: true
  community.general.pkgng:
    name: "*"
    state: latest

- name: "Add pkg aliases"
  ansible.builtin.include_tasks: "alias.yml"
  loop: "{{ pkg_aliases }}"
  loop_control:
    loop_var: _alias

- name: "Install packages {{ pkg_install }}"
  become: true
  community.general.pkgng:
    name: "{{ pkg_install }}"
    state: latest
  when: pkg_install | length > 0
