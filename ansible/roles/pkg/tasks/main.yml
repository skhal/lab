---
- name: Configure repositories
  vars:
    _conf_file: /usr/local/etc/pkg/repos/FreeBSD.conf
  block:
    - name: Create folder {{ _conf_file | dirname }}
      become: true
      ansible.builtin.file:
        path: "{{ _conf_file | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Use latest branch
      become: true
      ansible.builtin.copy:
        src: "{{ _conf_file | trim('/') }}"
        dest: "{{ _conf_file }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r

- name: Configure aliases
  when: pkg_aliases is defined
  block:
    - name: Add aliases
      loop: "{{ pkg_aliases | dict2items }}"
      become: true
      ansible.builtin.lineinfile:
        path: /usr/local/etc/pkg.conf
        insertafter: "^ALIAS {"
        line: '    {{ item.key }} = "{{ item.value }}";'

- name: "Install packages"
  when: pkg_install is defined
  become: true
  community.general.pkgng:
    name: "{{ pkg_install }}"
    state: latest
