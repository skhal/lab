---
- name: "Update {{ pkg_conf_path }} - add alias {{ _alias.name }}"
  vars:
    _conf_path: /usr/local/etc/pkg.conf
  become: true
  ansible.builtin.lineinfile:
    path: "{{ _conf_path }}"
    insertafter: "^ALIAS {"
    line: '    {{ _alias.name }} = "{{ _alias.value }}";'
