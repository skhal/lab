---
# keep-sorted start newline_separated=true
# zfs_mkhomedir_host is the host on the cluster that manages user home folders.
zfs_mkhomedir_host: "{{ undef(hint='host that manages homedirs with ZFS') }}"

# zfs_mkhomedir_users is a map of users to create homefolders for. The key is
# the username. Each value must have the following structure:
#   uid  number  user identifier to own the files
#   gid  number  user group identifier to own the files
zfs_mkhomedir_users: {}
# keep-sorted end
