---
- name: Create ZFS datasets
  vars:
    _dset: zroot/home/{{ _user.name }}
  block:
    - name: Create {{ _dset }}
      become: true
      community.general.zfs:
        name: "{{ _dset }}"
        state: present

    - name: Get mountpoint of {{ _dset }}
      community.general.zfs_facts:
        name: "{{ _dset }}"
        type: filesystem
        properties: "name,mountpoint"
      register: zfs_mkhomedir_dset_info_task

    - name: Fix ownership
      vars:
        _homedir: >-
          {{
            zfs_mkhomedir_dset_info_task.ansible_facts.ansible_zfs_datasets
              | selectattr('name', 'equalto', _dset)
              | map(attribute='mountpoint')
              | first
              | default(omit)
          }}
      become: true
      ansible.builtin.file:
        path: "{{ _homedir }}"
        owner: "{{ _user.uid }}"
        group: "{{ _user.gid }}"
        mode: u=rwx,g=rx,o=rx
