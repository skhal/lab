---
- name: "Configure RC info"
  when: rc_info is defined
  become: true
  community.general.sysrc:
    name: rc_info
    value: "{{ rc_info }}"

- name: "Configure RC debug"
  when: rc_debug is defined
  become: true
  community.general.sysrc:
    name: rc_debug
    value: "{{ rc_debug }}"
