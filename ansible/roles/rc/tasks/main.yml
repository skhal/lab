---
- name: "Clean /etc/rc.conf"
  loop: "{{ rc_remove }}"
  become: true
  community.general.sysrc:
    name: "{{ item }}"
    state: absent

- name: "Update rc-vars"
  ansible.builtin.include_tasks: "update.yml"
  loop: "{{ rc_update }}"
  loop_control:
    loop_var: _rc_var
