---
- name: "Install packages"
  vars:
    _pkg_python: "{{ bootstrap_packages | select('match', 'python') }}"
    _pkg_not_python: "{{ bootstrap_packages | reject('match', 'python') }}"
  block:
    # The remote does not have Python installed yet. Therefore run command via
    # ansible.builtin.raw.
    - name: "Install {{ _pkg_python | join(', ') }}"
      become: true
      ansible.builtin.raw: "pkg install --yes {{ _pkg_python | join(' ') }}"
      register: bootstrap_install_python_task
      changed_when:
        - bootstrap_install_python_task is succeeded
        - '"already installed" not in bootstrap_install_python_task.stdout'

    # Python is available. Use Ansible modules to install the rest of packages.
    - name: "Install {{ _pkg_not_python | join(',') }}"
      when: _pkg_not_python | length > 0
      become: true
      community.general.pkgng:
        name: "{{ _pkg_not_python }}"
