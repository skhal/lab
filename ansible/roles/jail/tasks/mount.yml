---
- name: Add mount points
  when: jail_mounts is defined
  loop: "{{ jail_mounts | dict2items }}"
  loop_control:
    loop_var: _item_mount
  vars:
    # defaults: mount at the same path with read-write permissions
    _mount: >-
      {{
        {
          'dest': _item_mount.key,
          'perm': 'rw'
        } | combine(_item_mount.value | default({}))
          | combine({'path': _item_mount.key })
      }}
  ansible.builtin.include_tasks: _mount.yml
