---
- name: Add dependency {{ _dep }}
  become: true
  ansible.builtin.lineinfile:
    path: /etc/jail.conf.d/{{ jail_name }}.conf
    line: |
      depend += "{{ _dep }}";
    insertafter: "# dependencies"
