---
# keep-sorted start newline_separated=yes
# jail_allow_chflags adds allow.chflags to the jail configuration when enabled.
jail_allow_chflags: false

# jail_allow_mlock adds allow.mlock to the jail configuration when enabled.
jail_allow_mlock: false

# jail_allow_mount adds allow.mount to the jail configuration when enabled.
jail_allow_mount: false

# jail_allow_mount_devfs adds allow.mount.devfs to the jail configuration when
# enabled.
jail_allow_mount_devfs: false

# jail_allow_mount_linprocfs adds allow.mount.linprocfs to the jail
# configuration when enabled.
jail_allow_mount_linprocfs: false

# jail_allow_mount_nullfs adds allow.mount.nullfs to the jail configuration
# when enabled.
jail_allow_mount_nullfs: false

# jail_allow_mount_procfs adds allow.mount.procfs to the jail configuration
# when enabled.
jail_allow_mount_procfs: false

# jail_allow_mount_tmpfs adds allow.mount.tmpfs to the jail configuration when
# enabled.
jail_allow_mount_tmpfs: false

# jail_allow_mount_zfs adds allow.mount.zfs to the jail configuration when
# enabled.
jail_allow_mount_zfs: false

# jail_bridge is the jails bridge.
jail_bridge: ""

# jail_children_max sets the number of child jails allowed in the jail when
# set.
jail_children_max: ""

# jail_cidr is the IP with network marsk.
jail_cidr: ""

# jail_defaultrouter sets the IP for default route.
jail_defaultrouter: ""

# jail_depend is a list of jail names that this jail depends on (see jail(8)).
jail_depend: []

# jail_enforce_statfs controls access to mount points inside the jail (see
# jail(8)).
jail_enforce_statfs: ""

# jail_mounts maps a folder on the hosting node to the jail (see mount in
# jail(8)).
# The keys are source paths. The values are optional with the following
# structure:
#   dest  string? target mount path inside the jail (default: `path`)
#   perm  string? mount permissions (default: rw)
jail_mounts: "{{ undef(hint='mount points map') }}"

# jail_name is the jail name.
jail_name: ""

# jail_zfs_datasets is a list of datasets to enjail.
jail_zfs_datasets: []
# keep-sorted end
