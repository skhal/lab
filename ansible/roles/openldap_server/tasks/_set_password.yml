---
- name: Set password for {{ _entry.dn }}
  become: true
  community.general.ldap_passwd:
    server_uri: "{{ openldap_server_uri }}"
    bind_dn: "{{ openldap_server_bind_dn }}"
    bind_pw: "{{ openldap_server_bind_pw }}"
    start_tls: true
    validate_certs: true
    # --- record
    dn: "{{ _entry.dn }}"
    passwd: "{{ _entry.passwd }}"
