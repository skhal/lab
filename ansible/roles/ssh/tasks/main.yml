---
- name: Enable SSH server
  vars:
    _rc_file: /etc/rc.conf.d/sshd
    _rc_var: sshd_enable
  block:
    - name: Clean /etc/rc.conf
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        state: absent

    - name: Enable SSH server in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        value: true
        path: "{{ _rc_file }}"

- name: "Update configuration"
  vars:
    _conf_file: "{{ ssh_server_config }}"
  block:
    # noqa name[template]
    - name: "Update {{ _conf_file }} - listen on cloned interfaces"
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: "ListenAddress={{ item }}"
      loop: "{{ ssh_listen_addresses }}"
      notify: "restart_sshd"

    - name: "Update {{ _conf_file }} - allow op user" # noqa name[template]
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: "AllowUsers={{ ssh_allow_users | join(' ') }}"
      notify: "restart_sshd"
      when: ssh_allow_users | length > 0

    - name: "Allow groups {{ ssh_allow_groups | join(',') }}"
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: |-
          Match Group {{ _group }}
            AllowUsers *
      when: ssh_allow_groups | length > 0
      loop: "{{ ssh_allow_groups }}"
      loop_control:
        loop_var: _group
      notify: "restart_sshd"
