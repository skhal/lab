---
- name: Enable SSH server
  vars:
    _rc_file: /etc/rc.conf.d/sshd
    _rc_var: sshd_enable
  block:
    - name: Clean /etc/rc.conf
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        state: absent

    - name: Enable SSH server in {{ _rc_file }}
      become: true
      community.general.sysrc:
        name: "{{ _rc_var }}"
        value: true
        path: "{{ _rc_file }}"

- name: "Update configuration"
  vars:
    _conf_file: /etc/ssh/sshd_config
  block:
    - name: Allow groups {{ ssh_allow_groups | join(', ') }}
      when: ssh_allow_groups | length > 0
      loop: "{{ ssh_allow_groups }}"
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: |-
          Match Group {{ item }}
            AllowUsers *
        validate: /usr/sbin/sshd -t -f %s
      notify: ssh_restart_service

    - name: Allow users {{ ssh_allow_users | join(', ') }}
      when: ssh_allow_users | length > 0
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: "AllowUsers={{ ssh_allow_users | join(' ') }}"
        validate: /usr/sbin/sshd -t -f %s
      notify: ssh_restart_service

    - name: Listen addresses
      loop: "{{ ssh_listen_addresses }}"
      become: true
      ansible.builtin.lineinfile:
        path: "{{ _conf_file }}"
        line: "ListenAddress={{ item }}"
        validate: /usr/sbin/sshd -t -f %s
      notify: ssh_restart_service
