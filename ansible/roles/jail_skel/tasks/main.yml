---
- name: Create skeleton
  notify: "jail_skel_snapshot"
  block:
    - name: Create ZFS dataset
      become: true
      zfs_create:
        name: "{{ jail_skel_zfs_dataset }}"
        props:
          canmount: "on"
          readonly: "off"
        parent_props:
          canmount: "off"
          readonly: "on"
      register: jail_skel_zfs_dset_task

    - name: Bootstrap jail
      become: true
      pkg_bootstrap:
        path: "{{ jail_skel_zfs_dset_task.mountpoint }}"
        packages: >
          {{
            jail_skel_default_packages
              | union(jail_skel_packages | default([]))
          }}

    - name: Migrate users
      become: true
      user_migrate:
        name: >
          {{
            jail_skel_migrate_users_default
              | union(jail_skel_migrate_users | default([]))
          }}
        dest: "{{ jail_skel_zfs_dset_task.mountpoint }}"

    - name: Configure remote access
      become: true
      community.general.sysrc:
        name: sshd_enable
        value: true
        path: "{{ jail_skel_zfs_dset_task.mountpoint }}/etc/rc.conf"

- name: Configure jail service
  vars:
    _conf_file: /etc/jail.conf
    _rc_file: /etc/rc.conf.d/jail
  block:
    - name: Create {{ _conf_file }}
      become: true
      vars:
        _jailbase: "{{ jail_skel_zfs_dset_task.mountpoint | dirname }}"
      ansible.builtin.template:
        src: "{{ _conf_file | trim('/') }}.j2"
        dest: "{{ _conf_file }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r
        validate: /usr/sbin/jail -f %s -e ' '

    - name: Enable jail service
      become: true
      community.general.sysrc:
        name: jail_enable
        value: true
        path: "{{ _rc_file }}"

    - name: Stop jails in reverse order
      become: true
      community.general.sysrc:
        name: jail_reverse_stop
        value: true
        path: "{{ _rc_file }}"
