# WARNING
#
# Do not use ansible.builtin.service to manage PF because it affects SSH
# connections. Instead, run async task.
#
# Ref: https://superuser.com/a/1777486
---
# reload_pf_conf reloads non-empty /etc/pf.conf and must be done asynchronously.
- name: Reload PF config
  listen: pf_reload_conf
  become: true
  ansible.builtin.shell:
    cmd: "((sleep 1; nohup pfctl -f /etc/pf.conf) & )"
  async: 5
  poll: 0
  register: pf_reload_conf_task

- name: Wait for PF to reload config
  listen: pf_reload_conf
  ansible.builtin.async_status:
    jid: "{{ pf_reload_conf_task.ansible_job_id }}"
  retries: 10
  delay: 1 # pf.conf load id O(sec); wait for 1s b/w retries
  register: pf_reload_conf_wait_task
  until: pf_reload_conf_wait_task is finished
