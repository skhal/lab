---
- name: Create config
  become: true
  ansible.builtin.file:
    path: /etc/pf.conf
    state: touch
    access_time: preserve # don't change if exists
    modification_time: preserve # don't change if exists
    owner: root
    group: wheel
    mode: u=rw,g=r,o=r

- name: Enable pf
  become: true
  community.general.sysrc:
    path: /etc/rc.conf.d/pf
    name: pf_enable
    value: true

# start_pf enables PF synchronously because it assumes the configuration
# /etc/pf.conf is empty, effectively no filters applied.
#
- name: Start PF service
  become: true
  ansible.builtin.service:
    name: pf
    state: started

- name: "Configure pf"
  vars:
    _conf_file: /etc/pf.conf
  become: true
  ansible.builtin.template:
    src: "{{ _conf_file | trim('/') }}.j2"
    dest: "{{ _conf_file }}"
    owner: root
    group: wheel
    mode: u=rw,g=r,o=r
    validate: /sbin/pfctl -nf %s
  notify: "reload_pf_conf"
