---
# keep-sorted start newline_separated=yes
# local_pkg_hostname is the hostname of the pkg(8) server.
local_pkg_hostname: ""

# local_pkg_listen_on is the IP4 address to listen on.
local_pkg_listen_on: ""

# local_pkg_repos maps repositories to the configuration. The configuration is
# installed in <localbase>/etc/pkg/repos/<name>.conf.
#
# The key is one of the supported repository names from the role's templates.
#
# The values is optional and has the following structure when present:
#   orig  string? the old repository name this one replaces. This field
#                 triggers an update of `repository` annotation in installed
#                 packages from <orig> value to <name> to prefer newly
#                 installed repository in pkg-upgrade(8).
local_pkg_repos: "{{ undef(hint='a map of repository configurations to install') }}"
# keep-sorted end
