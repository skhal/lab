---
- name: Update packages repo to {{ _dst_repo }}
  become: true
  ansible.builtin.script:
    cmd: pkg-mv-repo.sh {{ _src_repo }} {{ _dst_repo }}
  register: local_pkg_update_pkg_repo_task
  changed_when: local_pkg_update_pkg_repo_task.stdout != ''
