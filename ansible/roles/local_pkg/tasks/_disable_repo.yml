---
- name: Disable {{ _repo }}
  become: true
  ansible.builtin.lineinfile:
    path: /usr/local/etc/pkg/repos/zzz.conf
    line: "{{ _repo }}: { enabled: no }"
    owner: root
    group: wheel
    create: true
    mode: u=rw,g=r,o=r
