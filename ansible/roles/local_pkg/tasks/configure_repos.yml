---
- name: Configure pkg repositories
  vars:
    _conf_path: /usr/local/etc/pkg/repos
  block:
    - name: Create {{ _conf_path }}
      become: true
      ansible.builtin.file:
        path: "{{ _conf_path }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Configure
      loop: "{{ local_pkg_repos | dict2items }}"
      loop_control:
        loop_var: _item_repo
      vars:
        _repo: >-
          {{
            _item_repo.value
              | default({})
              | combine({
                'name': _item_repo.key,
                'conf': (_conf_path, _item_repo.key + '.conf') | path_join
              })
          }}
      ansible.builtin.include_tasks: _configure_repo.yml
