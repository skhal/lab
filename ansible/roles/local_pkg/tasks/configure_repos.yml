---
- name: Configure pkg repositories
  vars:
    _conf_path: /usr/local/etc/pkg/repos
  block:
    - name: Create {{ _conf_path }}
      become: true
      ansible.builtin.file:
        path: "{{ _conf_path }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Install configs
      ansible.builtin.include_tasks: _configure_repo.yml
      loop: "{{ local_pkg_repos }}"
      vars:
        _conf_file: "{{ (_conf_path, item.conf) | path_join }}"

    - name: Disable canonical repos
      ansible.builtin.include_tasks: _disable_repo.yml
      loop: "{{ local_pkg_repos }}"
      when: item.orig is defined
      vars:
        _repo: "{{ item.orig }}"

    - name: Update package annotations
      ansible.builtin.include_tasks: _update_pkg_repo.yml
      loop: "{{ local_pkg_repos }}"
      when: item.orig is defined
      vars:
        _src_repo: "{{ item.orig }}"
        _dst_repo: "{{ item.name }}"
