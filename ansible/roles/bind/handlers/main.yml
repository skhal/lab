---
- name: "Start bind"
  listen: "bind_start"
  become: true
  ansible.builtin.service:
    name: named
    state: started

- name: "Restart bind"
  listen: "bind_restart"
  become: true
  ansible.builtin.service:
    name: named
    state: restarted

- name: "Record bind restart"
  listen: "bind_restart"
  ansible.builtin.set_fact:
    bind_restarted: true
