# NAME
#   init-nuc • minimal configuration of fresh OS
#
# SYNOPSIS
#   ansible-playbook ./playbooks/init-nuc.yml
#
# DESCRIPTION
#   init-nuc performs minimal configuration of NUC with a fresh installation
#   of FreeBSD OS.
---
- name: Configure sysctl
  hosts: nuc.lab.net
  tags: init-nuc-sysctl
  roles:
    - role: lab.general.sysctl

- name: Configure loader
  hosts: nuc.lab.net
  tags: init-nuc-loader
  roles:
    - role: lab.general.autoboot

- name: Configure services
  hosts: nuc.lab.net
  tags: init-nuc-rc
  roles:
    # keep-sorted start
    - role: lab.general.hostname
    - role: lab.general.moused
    - role: lab.general.ntp
    - role: lab.general.periodic
    - role: lab.general.pkg
    - role: lab.general.rc
    - role: lab.general.syslog
    - role: lab.general.timezone
    - role: powerd
    # keep-sorted end

- name: Configure ZFS
  hosts: nuc.lab.net
  tags: init-nuc-zfs
  roles:
    - role: lab.general.zfs
    - role: lab.general.zfs_scrub

- name: Bootstrap users
  hosts: nuc.lab.net
  tags: init-nuc-user
  roles:
    - role: lab.general.user
    - role: lab.general.doas

- name: Configure network
  hosts: nuc.lab.net
  tags: init-nuc-network
  roles:
    - role: lab.general.routing
    - role: lab.general.netif

- name: Configure firewall
  hosts: nuc.lab.net
  tags: init-nuc-firewall
  roles:
    - role: lab.general.pf

- name: Configure remote access
  hosts: nuc.lab.net
  tags: init-nuc-access
  roles:
    - role: lab.general.ssh

- name: Reboot
  hosts: nuc.lab.net
  tags: init-nuc-reboot
  become: true
  tasks:
    - name: Reboot NUC
      ansible.builtin.reboot:
