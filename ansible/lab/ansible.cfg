[defaults]
# keep-sorted start
callbacks_enabled = timer, profile_tasks, profile_roles
# galaxy installed collections + shared local collections
collections_path = ./.collections:../collections
gathering = explicit
inventory = ./inventory
log_path = ~/.ansible/log/lab.log
module_utils = ./module_utils
nocows = true
roles_path = ./roles
vault_password_file = ~/.ansible/vault/lab_pass
# keep-sorted end

# https://www.redhat.com/en/blog/faster-ansible-playbook-execution
[connection]
pipelining = true

[privilege_escalation]
become_method = ansible.builtin.doas

[ssh_connection]
# ControlMaster - reuse existing connections
# ControlPersist - keep connections alive for N seconds after last session
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
