---
- name: Configure pkg repositories
  vars:
    _conf_path: /usr/local/etc/pkg/repos
  block:
    - name: Create {{ _conf_path }}
      become: true
      ansible.builtin.file:
        path: "{{ _conf_path }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Configure
      loop: "{{ local_pkg_repos | dict2items }}"
      loop_control:
        loop_var: _item_repo
      vars:
        _repo: >-
          {{
            _item_repo.value
              | default({})
              | combine({
                'name': _item_repo.key,
                'conf': (_conf_path, _item_repo.key + '.conf') | path_join
              })
          }}
      ansible.builtin.include_tasks: _configure_repo.yml

- name: Fetch public key
  when: local_pkg_rsa_fetch is defined
  vars:
    _src_host: "{{ local_pkg_rsa_fetch.source | split(':', 1) | first }}"
    _src_path: "{{ local_pkg_rsa_fetch.source | split(':', 1) | last }}"
    _dst_path: "{{ local_pkg_rsa_fetch.target }}"
  block:
    - name: Create path for public key
      become: true
      ansible.builtin.file:
        path: "{{ _dst_path | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Load public key
      ansible.builtin.slurp:
        src: "{{ _src_path }}"
      register: local_pkg_public_key_task
      delegate_to: "{{ _src_host }}"

    - name: Write public key
      become: true
      ansible.builtin.copy:
        dest: "{{ _dst_path }}"
        content: "{{ local_pkg_public_key_task.content | b64decode }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r
