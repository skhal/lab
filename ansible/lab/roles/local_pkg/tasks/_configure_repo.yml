---
- name: Write {{ _repo.conf }}
  become: true
  ansible.builtin.template:
    src: "{{ _repo.conf | relpath('/') }}.j2"
    dest: "{{ _repo.conf }}"
    owner: root
    group: wheel
    mode: u=rw,g=r,o=r

- name: Disable original
  when: _repo.orig is defined
  block:
    - name: Disable {{ _repo.orig }}
      become: true
      ansible.builtin.lineinfile:
        path: /usr/local/etc/pkg/repos/zzz.conf
        line: "{{ _repo.orig }}: { enabled: no }"
        owner: root
        group: wheel
        create: true
        mode: u=rw,g=r,o=r

    - name: Update packages repo to {{ _repo.name }}
      become: true
      ansible.builtin.script:
        cmd: pkg-mv-repo.sh {{ _repo.orig }} {{ _repo.name }}
      register: local_pkg_update_pkg_repo_task
      changed_when: local_pkg_update_pkg_repo_task.stdout != ''

- name: Fetch public key
  when: _repo.rsa_fetch is defined
  vars:
    _src_host: "{{ _repo.rsa_fetch.source | split(':', 1) | first }}"
    _src_path: "{{ _repo.rsa_fetch.source | split(':', 1) | last }}"
    _dst_path: "{{ _repo.rsa_fetch.target }}"
  block:
    - name: Create path for public key
      become: true
      ansible.builtin.file:
        path: "{{ _dst_path | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: u=rwx,g=rx,o=rx

    - name: Load public key
      ansible.builtin.slurp:
        src: "{{ _src_path }}"
      register: local_pkg_public_key_task
      delegate_to: "{{ _src_host }}"

    - name: Write public key
      become: true
      ansible.builtin.copy:
        dest: "{{ _dst_path }}"
        content: "{{ local_pkg_public_key_task.content | b64decode }}"
        owner: root
        group: wheel
        mode: u=rw,g=r,o=r
