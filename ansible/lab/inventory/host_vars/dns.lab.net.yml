---
# keep-sorted start
ansible_jexec_over_ssh_jail_name: dns
certval_certificates:
  - name: "DNS Certificate"
    path: /usr/local/etc/namedb/ssl/bind.crt
dns_bind_listen_on:
  port: 853
  addr: 10.0.0.2
  tls: local-tls
dns_bind_tls:
  name: local-tls
  cert: /usr/local/etc/namedb/ssl/bind.crt
  key: /usr/local/etc/namedb/ssl/private/bind.key
  protocols:
    - TLSv1.3
dns_bind_zones:
  - lab.net
openssl_gen_certs:
  - name: Bind Cert
    path: "/usr/local/etc/namedb/ssl/bind.crt"
    owner: bind
    group: bind
ssh_listen_addresses:
  - 10.0.0.2
# keep-sorted end
